name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/netpulse

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t netpulse:ci .
      - name: Smoke test container
        run: |
          docker run -d --name np -p 8080:8080 netpulse:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health
          docker exec np /netpulse -healthcheck
          docker logs np
